name: Edit stop
description: Change or delete an existing stop. Opens a pull request for you to review.
title: "[Edit stop] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        **Fill in only what you want to change**: blank fields keep their current value, and a single `-` clears an optional field (era, grid reference, elevation, walk time, interpretation).

        A filled **Body** replaces the whole body. New photos/video/audio are appended to the end of the existing body.
  - type: dropdown
    id: tour
    attributes:
      label: Tour
      options:
        # tours:begin (generated by scripts/sync-issue-templates.mjs)
        - cissbury-ring
        - devil-s-dyke-circuit
        - mount-caburn
        - wolstonbury-hill
        # tours:end
    validations:
      required: true
  - type: input
    id: stop_id
    attributes:
      label: Stop id
      description: The `id` of the stop to edit (its filename in `content/routes/<tour>/stops/`, without `.md`).
    validations:
      required: true
  - type: input
    id: stop_title
    attributes:
      label: Stop title
  - type: input
    id: lat
    attributes:
      label: Latitude
      description: Decimal degrees. You can paste a `lat, lng` pair here and leave Longitude empty.
  - type: input
    id: lng
    attributes:
      label: Longitude
  - type: input
    id: radius
    attributes:
      label: Proximity radius (m)
  - type: input
    id: era
    attributes:
      label: Era
  - type: input
    id: grid_ref
    attributes:
      label: Grid reference
  - type: input
    id: elevation
    attributes:
      label: Elevation
  - type: input
    id: walk_time
    attributes:
      label: Walk time
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation
  - type: textarea
    id: body
    attributes:
      label: Body
      description: Replaces the whole body. Drag photos and video straight into this box.
  - type: textarea
    id: hero
    attributes:
      label: Hero photo
      description: Drag one image here to replace the hero, with a caption on the next line.
  - type: textarea
    id: photos
    attributes:
      label: Photos & video
      description: Drag files here, with a caption on the line after each. Appended to the body.
  - type: textarea
    id: extras
    attributes:
      label: Audio & 3D models
      description: Attach a `.zip` of `.mp3` / `.glb` files, or give one `https://… | caption` per line.
  - type: checkboxes
    id: delete
    attributes:
      label: Delete stop
      options:
        - label: Delete this stop (ignores every other field)
