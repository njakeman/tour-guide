name: Add stop
description: Add a stop to an existing tour. Opens a pull request for you to review.
title: "[Add stop] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Adds `stops/<stop id>.md` to the tour and inserts it in `tour.yaml`. If something is rejected, a comment explains why: **edit this issue** and it runs again.
  - type: dropdown
    id: tour
    attributes:
      label: Tour
      options:
        # tours:begin (generated by scripts/sync-issue-templates.mjs)
        - cissbury-ring
        - devil-s-dyke-circuit
        - mount-caburn
        - wolstonbury-hill
        # tours:end
    validations:
      required: true
  - type: input
    id: stop_title
    attributes:
      label: Stop title
    validations:
      required: true
  - type: input
    id: stop_id
    attributes:
      label: Stop id
      description: Lowercase letters, digits and hyphens. Leave blank to derive it from the title.
  - type: input
    id: after
    attributes:
      label: Insert after stop id
      description: The stop this one follows. Leave blank to add it at the end, or type `start` to make it first.
  - type: input
    id: lat
    attributes:
      label: Latitude
      description: Decimal degrees. You can paste a `lat, lng` pair copied from a maps app here and leave Longitude empty.
      placeholder: 50.8570
    validations:
      required: true
  - type: input
    id: lng
    attributes:
      label: Longitude
      placeholder: "-0.3780"
  - type: input
    id: radius
    attributes:
      label: Proximity radius (m)
      description: How close the walker must be for the "you're here" state. Blank = 30.
      placeholder: "30"
  - type: input
    id: era
    attributes:
      label: Era
      placeholder: Iron Age · Neolithic substratum
  - type: input
    id: grid_ref
    attributes:
      label: Grid reference
      placeholder: TQ 140 082
  - type: input
    id: elevation
    attributes:
      label: Elevation
      placeholder: 184m AOD
  - type: input
    id: walk_time
    attributes:
      label: Walk time
      placeholder: 10 min
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What is physically visible or measurable here.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation
      description: Optional. What the evidence might mean.
  - type: textarea
    id: body
    attributes:
      label: Body
      description: The story of the stop, in markdown. Drag photos and video straight into this box. Put `{{media}}` where the boxes below should appear.
    validations:
      required: true
  - type: textarea
    id: hero
    attributes:
      label: Hero photo
      description: Optional. Drag one image here, with a caption on the next line. (On phones the hero is replaced by the live map; the photo shows on tablet and desktop.)
  - type: textarea
    id: photos
    attributes:
      label: Photos & video
      description: Optional. Drag files here, with a caption on the line after each.
  - type: textarea
    id: extras
    attributes:
      label: Audio & 3D models
      description: Optional. Attach a `.zip` of `.mp3` / `.glb` files, or give one `https://… | caption` per line.
